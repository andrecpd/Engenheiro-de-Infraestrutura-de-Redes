name: NetOps static validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate Python syntax
        run: python -m compileall -q 06-python
      - name: Run prefix validation exercise
        run: python 06-python/validate_prefixes.py
      - name: Check Ansible playbook syntax
        run: |
          python -m pip install --disable-pip-version-check ansible-core
          ansible-playbook -i 05-ansible/inventory/lab.yml 05-ansible/playbooks/collect.yml --syntax-check
